services:
  - type: web
    name: thc-backend
    runtime: docker
    plan: starter  # or standard/pro
    region: oregon  # choose your region
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: thc-db
          property: connectionString
      - key: SECRET_KEY
        sync: false  # Set manually or via environment

  - type: pserv
    name: thc-db
    plan: starter
    region: oregon
    ipAllowList: []  # Allow from all IPs