version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

jobs:
  build_and_test:
    docker:
      - image: cimg/python:3.14
        environment:
          DATABASE_URL: postgresql+psycopg://postgres:challenge@localhost:5432/test_postgres
          SECRET_KEY: test-secret-key-for-testing-only
          PYTHONPATH: src:.

      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: challenge
          POSTGRES_DB: test_postgres

    resource_class: medium

    steps:
      - checkout

      - run:
          name: Install PostgreSQL client and uv
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client
            curl -LsSf https://astral.sh/uv/install.sh | sh

      - restore_cache:
          keys:
            - uv-cache-v1-{{ checksum "uv.lock" }}

      - run:
          name: Install dependencies
          command: uv sync --frozen

      - save_cache:
          key: uv-cache-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

      - run:
          name: Install dockerize
          command: |
            wget https://github.com/jwilder/dockerize/releases/download/$DOCKERIZE_VERSION/dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && \
            sudo tar -C /usr/local/bin -xzvf dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && \
            rm dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz
          environment:
            DOCKERIZE_VERSION: v0.6.1

      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 1m

      - run:
          name: Run migrations
          command: uv run alembic upgrade head

      - run:
          name: Run tests
          command: |
            uv run --group dev pytest -v --cov .

      - codecov/upload

workflows:
  build_test_deploy:
    jobs:
      - build_and_test